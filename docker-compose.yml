# =============================================================================
# AksharaMitra (అక్షరమిత్ర) – Isolated Production Docker Compose
# Bound exclusively to 127.0.0.1:8510 so it NEVER conflicts with FinPilot AI
# or other existing SHR Trinity services on the host server.
# =============================================================================
version: "3.9"

services:
  aksharamitra:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shr_aksharamitra_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8510:8501"
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    volumes:
      - aksharamitra_data:/app/kb_cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  aksharamitra_data:

