# =============================================================================
# AksharaMitra (అక్షరమిత్ర) – Isolated Production Docker Compose
# Target Host Directory: /opt/shrtrinity/aksharamitra
# Internal Container Port: 8501  |  VPS Host Port: 127.0.0.1:8510
#
# SAFETY & ISOLATION:
# - Bound exclusively to 127.0.0.1:8510 (never conflicts with FinPilot AI)
# - Secrets mounted read-only from host (.streamlit/) outside the image
# - SQLite database, uploads (pdfs/), and RAG indexes (kb_cache/) persisted
# =============================================================================

services:
  aksharamitra:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shr_aksharamitra_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8510:8501"
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    volumes:
      # Persist SQLite database & student/application data
      - ./users.db:/app/users.db
      - ./data:/app/data
      # Preserve uploaded files & RAG indexes
      - ./kb_cache:/app/kb_cache
      - ./pdfs:/app/pdfs
      # Mount Streamlit config & host-only secrets.toml read-only
      - ./.streamlit:/app/.streamlit:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
