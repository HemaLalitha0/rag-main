# =============================================================================
# Nginx Reverse Proxy Configuration for MockMate (SHR Trinity)
# Target path on Ubuntu Server: /etc/nginx/sites-available/mockmate.conf
# Symlink to: /etc/nginx/sites-enabled/mockmate.conf
#
# SAFETY NOTE:
# Dedicated server_name (mockmate.shrtrinity.io and mockmate.shrtrinity.com)
# proxies to isolated localhost port 127.0.0.1:8511. It does NOT touch
# finpilot.shrtrinity.com (root proxy) or aksharamitra.shrtrinity.io (8510).
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name mockmate.shrtrinity.io mockmate.shrtrinity.com;

    # Certbot will automatically inject SSL redirection here
    location / {
        proxy_pass http://127.0.0.1:8511;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location /_stcore/stream {
        proxy_pass http://127.0.0.1:8511/_stcore/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
