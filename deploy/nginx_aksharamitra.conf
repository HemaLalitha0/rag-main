# =============================================================================
# Nginx Reverse Proxy Configuration for AksharaMitra (SHR Trinity)
# Target path on Ubuntu Server: /etc/nginx/sites-available/aksharamitra.conf
# Symlink to: /etc/nginx/sites-enabled/aksharamitra.conf
#
# SAFETY NOTE:
# This virtual host uses a dedicated server_name (aksharamitra.shrtrinity.com)
# and proxies to isolated localhost port 127.0.0.1:8510. It does NOT modify or
# interfere with finpilot.shrtrinity.com.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name aksharamitra.shrtrinity.com;

    # Redirect HTTP to HTTPS once SSL certificate is provisioned via Certbot
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aksharamitra.shrtrinity.com;

    # SSL Certificates (Provisioned via: sudo certbot --nginx -d aksharamitra.shrtrinity.com)
    ssl_certificate /etc/letsencrypt/live/aksharamitra.shrtrinity.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aksharamitra.shrtrinity.com/privkey.pem;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 50M;

    # Main Streamlit Application & WebSocket Proxy
    location / {
        proxy_pass http://127.0.0.1:8510;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support required by Streamlit (/_stcore/stream)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location /_stcore/stream {
        proxy_pass http://127.0.0.1:8510/_stcore/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}

