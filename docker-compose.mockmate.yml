# =============================================================================
# MockMate (SHR Trinity) – Isolated Production Docker Compose
# Target Host Directory: /opt/shrtrinity/mockmate
# Internal Container Port: 8501  |  VPS Host Port: 127.0.0.1:8511
#
# SAFETY & ISOLATION:
# - Bound exclusively to 127.0.0.1:8511 (never conflicts with FinPilot or AksharaMitra)
# - Secrets mounted read-only from host (.streamlit/) outside the image
# - SQLite database & uploads persisted
# =============================================================================

services:
  mockmate:
    build:
      context: .
      dockerfile: Dockerfile.mockmate
    container_name: shr_mockmate_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8511:8501"
      - "127.0.0.1:8765:8765"
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    volumes:
      # Persist SQLite database & candidate session data in writable /app/data directory
      - ./auth_guard.py:/app/auth_guard.py:ro
      - ./interview_bridge_server.py:/app/interview_bridge_server.py:ro
      - ./video_components.py:/app/video_components.py:ro
      - ./interview_engine.py:/app/interview_engine.py:ro
      - ./audio_service.py:/app/audio_service.py:ro
      - ./voicebox_client.py:/app/voicebox_client.py:ro
      - ./pages/MockMate.py:/app/pages/MockMate.py:ro
      - ./pages/mock_interview.py:/app/pages/mock_interview.py:ro
      - ./static:/app/static:ro
      - ./data:/app/data
      - ./kb_cache:/app/kb_cache
      - ./pdfs:/app/pdfs
      # Mount Streamlit config & host-only secrets.toml read-only
      - ./.streamlit:/app/.streamlit:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

